<style>
:root{--g:#173D2B;--iv:#F8F4E9;--au:#C4A46A;--tx:#1d2a22;--card:#fff;--mut:#5b665f;--bd:#e5dcc6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--iv:#101a14;--tx:#efe9d8;--card:#17251c;--mut:#a9b3a9;--bd:#2b3d31;--g:#8fc7a3}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--iv);color:var(--tx);font:16px/1.65 "Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--g);line-height:1.2;margin:0 0 .6rem}
h1{font-size:clamp(2.2rem,6vw,3.8rem)}h2{font-size:clamp(1.6rem,4vw,2.3rem)}
a{color:inherit}.w{max-width:1080px;margin:auto;padding:0 20px}.sec{padding:56px 0}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--iv);border-bottom:1px solid var(--bd);z-index:5}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.45rem Georgia,serif;letter-spacing:.18em;color:var(--g);text-decoration:none;line-height:1.1}
nav ul{display:flex;gap:18px;list-style:none;margin:0;padding:0}nav a{text-decoration:none;font-size:.95rem}nav a:hover,nav a.on{color:var(--au)}
#mb{display:none;background:none;border:1px solid var(--bd);border-radius:8px;min-width:44px;min-height:44px;font-size:1.3rem;color:var(--tx)}
@media(max-width:1000px){#mb{display:block}nav ul{display:none;position:absolute;top:60px;left:0;right:0;background:var(--iv);flex-direction:column;padding:14px 20px;border-bottom:1px solid var(--bd)}nav ul.open{display:flex}nav ul a{display:block;padding:8px 0}}
.btn{display:inline-block;background:var(--au);color:#173D2B;border:0;border-radius:999px;padding:12px 24px;font:600 1rem inherit;text-decoration:none;cursor:pointer;box-shadow:0 4px 14px #0002;margin:4px 6px 4px 0;min-height:44px}
.btn.o{background:none;border:1.5px solid var(--au);color:var(--tx);box-shadow:none}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--au);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:48px 0}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.art{aspect-ratio:1;border-radius:24px;background:radial-gradient(circle at 30% 25%,#2d6a4a,#173D2B);display:grid;place-items:center;color:#F8F4E9;text-align:center;box-shadow:0 20px 50px #0003;animation:f 6s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.art{animation:none}}
.art b{font:700 2.4rem Georgia,serif;letter-spacing:.2em;display:block}.art span{color:var(--au);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 6px 20px #0001}
.card .ph{height:120px;border-radius:12px;background:linear-gradient(135deg,#173D2B,#3b7a58);display:grid;place-items:center;font-size:2.6rem;margin-bottom:12px}
.mut{color:var(--mut)}.note{font-size:.85rem;color:var(--mut);border-left:3px solid var(--au);padding-left:10px;margin:10px 0}
.alt{background:var(--card);border-block:1px solid var(--bd)}.ph.big{height:190px}.ph{overflow:hidden;padding:8px}.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}.logo svg{width:38px;height:38px}.logo small{display:block;font:500 .58rem "Segoe UI",sans-serif;letter-spacing:.3em;color:var(--au);margin-top:2px}
.pk{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pk span{border:1px solid var(--au);border-radius:999px;padding:4px 14px;font-size:.9rem}
form{display:grid;gap:12px;max-width:640px}label{display:grid;gap:4px;font-size:.92rem;font-weight:600}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
.err{color:#b3261e;font-size:.85rem;font-weight:400}.ok{background:#e4f2e8;color:#173D2B;border-radius:10px;padding:12px 14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.tools input{max-width:260px}
.chip{border:1px solid var(--au);background:none;color:var(--tx);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:44px;font:inherit}.chip.on{background:var(--au);color:#173D2B}
ol,ul.l{padding-left:22px}.steps{counter-reset:s;list-style:none;padding:0}.steps li{counter-increment:s;padding:10px 0 10px 48px;position:relative}.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--g);color:var(--iv);display:grid;place-items:center;font-weight:700}
.stars{color:var(--au);letter-spacing:2px;font-size:1.3rem}
footer{background:#173D2B;color:#F8F4E9;padding:40px 0;margin-top:30px}footer a{color:#C4A46A}
.vd{max-width:720px;margin:20px auto;border-radius:20px;overflow:hidden;box-shadow:0 12px 34px #0003;border:1px solid var(--bd)}.vd svg{display:block;width:100%}.vc{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);flex-wrap:wrap}.vc b{flex:1;font-family:Georgia,serif;color:var(--g)}.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--au);background:none;margin:0 3px;padding:0;cursor:pointer}.dot.on{background:var(--au)}
.sc{opacity:0;transition:opacity .5s}.sc.on{opacity:1}.sc .a{transform-box:fill-box;transform-origin:center}
@keyframes dr{0%{transform:translateY(-70px);opacity:0}60%,100%{transform:none;opacity:1}}@keyframes kn{0%,100%{transform:translateY(0)}50%{transform:translateY(28px)}}@keyframes rot{to{transform:rotate(360deg)}}@keyframes pw{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes sh{50%{opacity:.45}}
.sc.on .d1{animation:dr 1s both}.sc.on .d2{animation:dr 1s .5s both}.sc.on .d3{animation:dr 1s 1s both}.sc.on .kn{animation:kn 1s ease-in-out infinite}.sc.on .p1{animation:pop .4s .6s both}.sc.on .p2{animation:pop .4s 1.6s both}.sc.on .p3{animation:pop .4s 2.6s both}.sc.on .rot{animation:rot 10s linear infinite}.sc.on .rot2{animation:rot .8s linear infinite}.sc.on .sh{animation:sh 2s ease-in-out infinite}.sc.on .pw{animation:pw 3s both;transform-origin:50% 100%}.sc.on .st{animation:pw 1.6s both;transform-origin:50% 0}@media(prefers-reduced-motion:reduce){.sc .a{animation:none!important}}
#ps{position:relative;height:340px;background:#173D2B;overflow:hidden}#ps .sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}#ps .sl.on{opacity:1;animation:kb 6s ease-out both}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14)}}@media(prefers-reduced-motion:reduce){#ps .sl.on{animation:none}}
@media print{header,footer,.noprint{display:none!important}body{background:#fff;color:#000}}

</style>
